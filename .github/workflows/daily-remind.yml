name: Daily LINE Reminder

on:
  schedule:
  - cron: "0 1 * * 1-5"
  workflow_dispatch:

jobs:
  rich-remind:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run reminder script
        env:
          NOTION_TOKEN:       ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          LINE_TOKEN:         ${{ secrets.LINE_TOKEN }}
          LINE_GROUP_ID:      ${{ secrets.LINE_GROUP_ID }}
          LINE_USER_ID:       ${{ secrets.LINE_USER_ID }}
        run: python rich-remind.py

  maintenance-remind:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run maintenance reminder script
        env:
          NOTION_TOKEN_2:         ${{ secrets.NOTION_TOKEN_2 }}
          NOTION_DATABASE_ID_2: ${{ secrets.NOTION_DATABASE_ID_2 }}
          LINE_TOKEN:           ${{ secrets.LINE_TOKEN }}
          LINE_GROUP_ID_2:      ${{ secrets.LINE_GROUP_ID_2 }}
          LINE_USER_ID_2:       ${{ secrets.LINE_USER_ID_2 }}
        run: python remind2.py
